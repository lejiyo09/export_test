<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube MP3 변환기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1115;color:#fff;display:grid;place-items:center;padding:24px}
.card{width:min(720px,100%);background:#191c22;border:1px solid #2b3039;border-radius:22px;padding:32px;box-shadow:0 20px 60px #0006}
h1{margin:0 0 8px;font-size:30px}.sub{color:#aeb5c0;margin:0 0 28px}
.row{display:flex;gap:10px}@media(max-width:600px){.row{flex-direction:column}}
input{flex:1;min-width:0;padding:16px;border-radius:13px;border:1px solid #3a404b;background:#0e1014;color:#fff;font-size:16px;outline:none}
button{border:0;border-radius:13px;padding:0 22px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#111;min-height:54px}
button:disabled{opacity:.5;cursor:wait}.status{margin-top:18px;padding:14px;border-radius:12px;background:#101217;color:#cbd1da;white-space:pre-wrap;display:none}
.note{margin-top:22px;font-size:13px;color:#8e96a3;line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <h1>🎵 YouTube → MP3</h1>
  <p class="sub">URL을 입력하면 서버에서 오디오를 MP3로 변환합니다.</p>
  <form id="form">
    <div class="row">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
      <button id="btn" type="submit">MP3 변환</button>
    </div>
  </form>
  <div id="status" class="status"></div>
  <div class="note">권리가 있거나 다운로드가 허용된 콘텐츠에만 사용하세요. 서버에 파일을 장기간 저장하지 않고 변환 후 삭제합니다.</div>
</main>
<script>
const form=document.querySelector("#form"), input=document.querySelector("#url");
const btn=document.querySelector("#btn"), status=document.querySelector("#status");
form.addEventListener("submit",async e=>{
  e.preventDefault();
  const url=input.value.trim(); if(!url)return;
  btn.disabled=true; status.style.display="block"; status.textContent="변환 중입니다…\n영상 길이에 따라 시간이 걸릴 수 있습니다.";
  try{
    const r=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    if(!r.ok){let j={};try{j=await r.json()}catch{};throw new Error(j.error||"변환에 실패했습니다.");}
    const blob=await r.blob();
    const cd=r.headers.get("Content-Disposition")||"";
    let name="audio.mp3"; const m=cd.match(/filename\*=UTF-8''([^;]+)/i); if(m)name=decodeURIComponent(m[1]);
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    status.textContent="완료! MP3 다운로드가 시작됩니다.";
  }catch(err){status.textContent="오류:\n"+err.message;}
  finally{btn.disabled=false;}
});
</script>
</body>
</html>
