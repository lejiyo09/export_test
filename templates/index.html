<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Mixtape</title>
<style>
:root{--bg:#0a0b0f;--panel:#111319;--line:#252a34;--muted:#9299a6;--text:#f5f7fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -180px,#242936 0%,transparent 65%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:26px 16px;border-right:1px solid var(--line);background:rgba(10,11,15,.9);backdrop-filter:blur(16px)}.logo{font-size:21px;font-weight:850;padding:0 12px 28px}.logo span{opacity:.55;font-weight:600}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb5c0;text-align:left;padding:12px;border-radius:12px;cursor:pointer}.nav button.active,.nav button:hover{background:#191c23;color:#fff}.side-note{position:absolute;bottom:20px;left:28px;right:20px;color:#666e7b;font-size:11px;line-height:1.6}
.main{width:min(1180px,100%);margin:auto;padding:44px 42px 120px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#7f8794;margin-bottom:7px}.title{font-size:38px;line-height:1.08;margin:0;font-weight:850;letter-spacing:-.035em}.subtitle{margin:9px 0 26px;color:var(--muted);font-size:15px}
.search{display:flex;align-items:center;gap:10px;background:rgba(23,26,33,.9);border:1px solid #303540;border-radius:17px;padding:8px 8px 8px 16px;box-shadow:0 12px 40px #0004}.search-icon{color:#7d8591;font-size:19px}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:12px 4px;font-size:16px}.search input::placeholder{color:#69717e}.search button{border:0;background:#fff;color:#111;border-radius:12px;padding:11px 19px;font-weight:800;cursor:pointer}.search button:disabled{opacity:.5;cursor:wait}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 30px}.chip{border:1px solid var(--line);background:#12151b;color:#aeb5c0;border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer}.chip:hover{color:#fff;border-color:#414753}
.status{display:none;margin:0 0 20px;padding:13px 15px;border-radius:13px;border:1px solid #303640;background:#13161c;color:#cbd1da;white-space:pre-wrap}.status.error{border-color:#5b3035;color:#ffb5b5}.status.ok{border-color:#304d3d;color:#b7e5c8}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.section-head h2{font-size:17px;margin:0}.count{color:#737b88;font-size:12px}.results{display:grid;gap:8px}.item{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:14px;padding:9px 11px;border:1px solid transparent;border-radius:15px;background:rgba(18,21,27,.78);transition:.15s}.item:hover{background:#181b22;border-color:#2b303a;transform:translateY(-1px)}.thumb{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#222}.meta{min-width:0}.track-title{font-size:15px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel{font-size:12px;color:#858d9a;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;align-items:center;gap:8px}.open{width:38px;height:38px;border:1px solid #303640;border-radius:11px;background:#11141a;color:#adb4bf;cursor:pointer}.download{height:38px;border:0;border-radius:11px;padding:0 15px;background:#fff;color:#111;font-weight:800;cursor:pointer}.download:disabled,.open:disabled{opacity:.5;cursor:wait}.empty{padding:52px 20px;text-align:center;color:#727a87;border:1px dashed #292e37;border-radius:16px;background:#101218}
.bottom-player{position:fixed;left:calc(230px + 18px);right:18px;bottom:16px;max-width:calc(100% - 266px);margin:auto;background:rgba(18,21,27,.94);border:1px solid #303540;border-radius:16px;padding:10px 13px;display:none;align-items:center;gap:12px;backdrop-filter:blur(18px);box-shadow:0 14px 45px #0008}.mini-art{width:42px;height:42px;border-radius:9px;object-fit:cover}.mini-meta{flex:1;min-width:0}.mini-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-sub{font-size:11px;color:#7e8692;margin-top:2px}.player-msg{font-size:12px;color:#aeb5c0}.note{margin-top:28px;color:#666e7b;font-size:11px;line-height:1.7;max-width:760px}
@media(max-width:800px){.app{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}.logo{padding:0 4px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-note{display:none}.main{padding:30px 16px 110px}.title{font-size:31px}.bottom-player{left:12px;right:12px;max-width:none}}
@media(max-width:520px){.item{grid-template-columns:50px 1fr}.thumb{width:50px;height:50px}.actions{grid-column:2;justify-content:flex-end;margin-top:-5px}.open{display:none}.download{height:36px}.title{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="logo">MY MIXTAPE <span>/ music</span></div><nav class="nav"><button class="active" data-nav="search">⌕&nbsp; 검색</button><button data-nav="recent">◷&nbsp; 최근 검색</button><button data-nav="downloads">↓&nbsp; 다운로드</button></nav><div class="side-note">권한이 있는 콘텐츠에만<br>다운로드 기능을 사용하세요.</div></aside>
<main class="main">
<div class="eyebrow">Music discovery</div><h1 class="title">무엇을 들을까요?</h1><p class="subtitle">노래 제목, 아티스트, 앨범을 검색해 보세요.</p>
<form class="search" id="searchForm"><span class="search-icon">⌕</span><input id="query" placeholder="예: IU 밤편지, NewJeans, Lo-fi" autocomplete="off"><button id="searchBtn" type="submit">검색</button></form>
<div class="chips" id="chips"><button class="chip">아이유</button><button class="chip">NewJeans</button><button class="chip">YOASOBI</button><button class="chip">Lo-fi</button></div>
<div id="status" class="status"></div>
<section><div class="section-head"><h2 id="heading">검색 결과</h2><span class="count" id="count"></span></div><div id="results" class="results"><div class="empty">검색어를 입력하면 곡이 여기에 표시됩니다.</div></div></section>
<p class="note">검색 결과는 YouTube에서 가져옵니다. 다운로드가 허용된 콘텐츠에만 사용하세요. 변환 파일은 서버에 장기간 보관하지 않습니다.</p>
</main></div>
<div class="bottom-player" id="player"><img class="mini-art" id="miniArt" alt=""><div class="mini-meta"><div class="mini-title" id="miniTitle"></div><div class="mini-sub" id="miniSub"></div></div><div class="player-msg" id="playerMsg">다운로드 준비</div></div>
<script>
const form=document.getElementById("searchForm"),query=document.getElementById("query"),results=document.getElementById("results"),status=document.getElementById("status"),searchBtn=document.getElementById("searchBtn"),heading=document.getElementById("heading"),count=document.getElementById("count"),player=document.getElementById("player");
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};const fmt=s=>{if(s==null)return "";s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function showStatus(t,type=""){status.style.display="block";status.className="status "+type;status.textContent=t}function hideStatus(){status.style.display="none"}
async function search(q){q=q.trim();if(!q)return;searchBtn.disabled=true;results.innerHTML='<div class="empty">⌕ 검색 중…</div>';showStatus("YouTube에서 검색 중…");try{const r=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});const j=await r.json();if(!r.ok)throw Error(j.error||"검색에 실패했습니다.");heading.textContent='"'+q+'" 검색 결과';count.textContent=j.results.length+"개";if(!j.results.length){results.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';hideStatus();return}results.innerHTML=j.results.map(x=>'<article class="item"><img class="thumb" src="'+esc(x.thumbnail)+'" loading="lazy" alt=""><div class="meta"><div class="track-title">'+esc(x.title)+'</div><div class="channel">'+esc(x.channel)+(x.duration!=null?" · "+fmt(x.duration):"")+'</div></div><div class="actions"><button class="open" title="YouTube에서 열기" data-open="'+esc(x.url)+'">↗</button><button class="download" data-url="'+esc(x.url)+'" data-title="'+esc(x.title)+'" data-art="'+esc(x.thumbnail)+'">MP3</button></div></article>').join("");hideStatus()}catch(err){results.innerHTML='<div class="empty">검색 결과를 불러오지 못했습니다.</div>';showStatus("오류:\n"+err.message,"error")}finally{searchBtn.disabled=false}}
form.addEventListener("submit",e=>{e.preventDefault();search(query.value)});document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;query.value=b.textContent;search(query.value)});
results.addEventListener("click",async e=>{const open=e.target.closest("[data-open]");if(open){window.open(open.dataset.open,"_blank","noopener");return}const b=e.target.closest(".download");if(!b)return;b.disabled=true;b.textContent="…";player.style.display="flex";document.getElementById("miniTitle").textContent=b.dataset.title;document.getElementById("miniSub").textContent="MP3 변환";document.getElementById("miniArt").src=b.dataset.art;document.getElementById("playerMsg").textContent="변환 중…";try{const r=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:b.dataset.url})});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.error||"변환에 실패했습니다.")}const blob=await r.blob(),cd=r.headers.get("Content-Disposition")||"";let name="audio.mp3";const m=cd.match(/filename\*=UTF-8''([^;]+)/i);if(m)name=decodeURIComponent(m[1]);const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.getElementById("playerMsg").textContent="다운로드 시작";showStatus("✓ 다운로드가 시작되었습니다.","ok")}catch(err){document.getElementById("playerMsg").textContent="오류";showStatus("오류:\n"+err.message,"error")}finally{b.disabled=false;b.textContent="MP3"}});
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-nav]").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(b.dataset.nav!=="search")showStatus("이 메뉴는 다음 단계에서 연결할 수 있습니다.")}));query.focus();
</script>
</body></html>
